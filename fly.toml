# fly.toml app configuration file generated for moot on 2026-07-01T17:57:28Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'moot'
primary_region = 'iad'

[build]

[env]
  MOOT_CHECKIN_HOURS = '6'
  MOOT_DATA_DIR = '/data'
  MOOT_HOST = '0.0.0.0'
  MOOT_PORT = '8080'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    # Boot imports MCP + opens SQLite + migrations; 15s was tight and made
    # failed boots look like "health check timeout" instead of the real error.
    grace_period = '60s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
